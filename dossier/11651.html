    gsec.addEventListener('change', async e => {
      if (e.target.id === 'depth') { setDepth(+e.target.value); return; }
      if (e.target.dataset.f) { on[e.target.dataset.f] = e.target.checked; render(); if (e.target.checked && DEPTH > 1) { await autoExpand(); if (!selected) intro(); } }
      if (e.target.id === 'f-amb') { showAmb = e.target.checked; render(); }
      if (e.target.id === 'f-wrong') { showWrong = e.target.checked; render(); }
      if (e.target.id === 'f-layer') { showLayer = e.target.checked; render(); if (showLayer && DEPTH > 1) { await autoExpand(); if (!selected) intro(); } } });
    document.getElementById('q').addEventListener('input', renderPool);
    async function setDepth(dd) { DEPTH = dd;
      [...expanded].filter(id => level[id] >= dd && id !== centerId).sort((a, b) => level[b] - level[a]).forEach(id => collapse(id)); render(); await autoExpand(); if (!selected) intro(); }
    fbHooks.push(() => { render(); if (selected && byId[selected]) select(selected); else intro(); });
    const cnode = { id: centerId, kind: 'person', name: p.display, level: 0, zone: 'center', x: W / 2, y: H / 2, fx: W / 2, fy: H / 2 }; nodes.push(cnode); byId[centerId] = cnode; level[centerId] = 0;
    meta[centerId] = { id: centerId, kind: 'person', label: p.display, name_key: p.name_key, uids: [p.uid], n_declarants: 1, pin_uids: [p.uid] };
    (async () => { if (ego0 && ego0.center) merge(ego0, centerId); else await expand(centerId, { quiet: true });
      render(); intro(); await autoExpand(); intro();
      window.__graphExpand = async () => { while ((window.__pendingExpand || []).length) { const id = window.__pendingExpand.shift(); const m = meta[id];
          if (m && m.kind === 'person') { const zf = fkind({ kind: (links.find(l => l.source.id === id || l.target.id === id) || {}).kind }); if (!on[zf]) { on[zf] = true; render(); } await expand(id); const nd = byId[id]; if (nd) svg.transition().duration(400).call(zoom.translateTo, nd.x, nd.y); } } };
      window.__graphExpand(); })();
  }

  const want = (location.hash || '').slice(1); if (want && TABS.some(t => t[0] === want)) showTab(want);
})();

// окремі звіти до досьє (будуються на ноутбуці й зберігаються в links.report)
(async () => {
  for (let i = 0; i < 240 && !document.getElementById('reports'); i++) await new Promise(r => setTimeout(r, 500));
  const el = document.getElementById('reports'); if (!el || document.querySelector('.projnav')) return;  // є смуга проєкту — кнопки не дублюємо
  try {
    const rs = await fetch('/api/reports?uid=' + UID, { headers: hdr }).then(r => r.ok ? r.json() : []);
    el.innerHTML = rs.map(r => `<a class="btn" href="/person/${UID}/report/${encodeURIComponent(r.kind)}">📄 ${esc(r.title)}</a>`).join('');
  } catch (e) { /* звітів немає — нічого не показуємо */ }
})();
</script>
